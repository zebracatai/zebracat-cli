name: release

on:
  push:
    tags:
      - "v*"
  # Publish an existing release to npm again (for example after an npm outage):
  #   gh workflow run release.yml -f tag=v0.6.4
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to npm (e.g. v0.6.4)"
        required: true

permissions:
  contents: read

jobs:
  goreleaser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # GitHub build attestation: id-token signs it, attestations stores it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: goreleaser/goreleaser-action@v6
        with:
          # Pinned: a new goreleaser release can't change what ships without a commit here.
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signed provenance for every file the installers download. Anyone can check
      # an archive was built by this workflow from this repo:
      #   gh attestation verify zebracat_linux_amd64.tar.gz --repo zebracatai/zebracat-cli
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # npm Trusted Publishing: GitHub's OIDC token proves this workflow is the publisher,
  # so no npm token or one-time password is stored anywhere. One-time setup on npmjs.com:
  # @zebracat/cli -> Settings -> Trusted Publisher -> GitHub Actions,
  # organization "zebracatai", repository "zebracat-cli", workflow "release.yml".
  npm:
    needs: goreleaser
    if: ${{ !cancelled() && (needs.goreleaser.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - name: Package version must match the release tag
        working-directory: npm
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a release tag: $TAG" >&2; exit 1 ;; esac
          want="${TAG#v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$have" != "$want" ]; then
            echo "npm/package.json is $have but the tag is $TAG: install.js downloads the release named after this version, so they must match." >&2
            exit 1
          fi
      - name: The release assets the installer downloads exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          for a in zebracat_linux_amd64.tar.gz zebracat_linux_arm64.tar.gz zebracat_darwin_amd64.tar.gz zebracat_darwin_arm64.tar.gz zebracat_windows_amd64.zip zebracat_windows_arm64.zip; do
            printf '%s\n' "$names" | grep -qx "$a" || { echo "release $TAG has no $a" >&2; exit 1; }
          done
      - name: Skip if this version is already on npm
        id: published
        working-directory: npm
        run: |
          if npm view "@zebracat/cli@${TAG#v}" version >/dev/null 2>&1; then
            echo "@zebracat/cli@${TAG#v} is already on npm."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.published.outputs.skip != 'true'
        working-directory: npm
        run: npm publish --access public
